<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forex Super Study Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Forex Super Study Terminal</h1>
    <nav>
      <a href="#chart">Live Chart</a>
      <a href="#dashboard">Dashboard</a>
      <a href="#news">News</a>
    </nav>
  </header>

  <!-- Live Chart -->
  <section id="chart">
    <h2>Live Market Chart</h2>
    <div class="tradingview-widget-container">
      <div id="tradingview_chart"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script>
        new TradingView.widget({
          "width": "100%",
          "height": 500,
          "symbol": "FX:EURUSD",
          "interval": "60",
          "timezone": "Etc/UTC",
          "theme": "dark",
          "style": "1",
          "locale": "en"
        });
      </script>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dashboard">
    <h2>Signal Board</h2>
    <ul id="signals"></ul>
    <h3 id="consensus"></h3>
  </section>

  <!-- News -->
  <section id="news">
    <h2>Latest Forex News & Predictions</h2>
    <ul id="newsFeed"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
