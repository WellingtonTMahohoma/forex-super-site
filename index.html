<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>(WELLAZ) Forex Super Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Forex Super Study Terminal</h1>

  <!-- Currency Pair Selection -->
  <div id="pairSelector">
    <label for="fromCurrency">From:</label>
    <select id="fromCurrency">
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
      <option value="GBP">GBP</option>
      <option value="JPY">JPY</option>
      <option value="AUD">AUD</option>
      <option value="CAD">CAD</option>
    </select>

    <label for="toCurrency">To:</label>
    <select id="toCurrency">
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
      <option value="GBP">GBP</option>
      <option value="JPY">JPY</option>
      <option value="AUD">AUD</option>
      <option value="CAD">CAD</option>
    </select>

    <button onclick="runDashboard()">Update Dashboard</button>
  </div>

 <!-- Live TradingView Chart -->
<div id="chart">
  <div id="tradingview_chart"></div>
</div>

<!-- Load TradingView library once -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>


  <!-- Dashboard Signals -->
  <h2>Dashboard Signals</h2>
  <ul id="signals"></ul>

  <!-- Consensus -->
  <h3 id="consensus">Consensus: ➡ Neutral</h3>

  <!-- News Feed -->
  <h2>Forex News Feed</h2>
  <ul id="newsFeed"></ul>

  <script src="script.js"></script>
</body>
</html>
