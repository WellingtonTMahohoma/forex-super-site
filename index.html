<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forex Super Study Terminal</title>
  <link rel="stylesheet" href="style.css">
  <!-- TradingView Widget Script -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <h1>(WELLAZ) Forex Super Study Terminal</h1>

  <!-- Currency Selector -->
  <div class="currency-select">
    <label for="fromCurrency">From:</label>
    <select id="fromCurrency">
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
      <option value="GBP">GBP</option>
      <option value="JPY">JPY</option>
    </select>

    <label for="toCurrency">To:</label>
    <select id="toCurrency">
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
      <option value="GBP">GBP</option>
      <option value="JPY">JPY</option>
    </select>

    <button onclick="runDashboard()">Update</button>
  </div>

  <!-- TradingView Chart -->
  <div id="tradingview_chart"></div>

  <!-- Indicator Grid -->
  <div class="indicator-grid">
    <div class="indicator-card" id="maCard"></div>
    <div class="indicator-card" id="rsiCard"></div>
    <div class="indicator-card" id="macdCard"></div>
    <div class="indicator-card" id="bollingerCard"></div>
    <div class="indicator-card" id="newsCard"></div>
  </div>

  <!-- Consensus Panel -->
  <div class="consensus-panel" id="consensus"></div>

  <!-- News Feed -->
  <h2>Latest News</h2>
  <ul id="newsFeed"></ul>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
