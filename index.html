<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forex Super Study Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Forex Super Study Terminal</h1>

  <!-- Currency Pair Selection -->
  <div id="pairSelector">
    <label for="fromCurrency">From:</label>
    <select id="fromCurrency">
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
      <option value="GBP">GBP</option>
      <option value="JPY">JPY</option>
      <option value="AUD">AUD</option>
      <option value="CAD">CAD</option>
    </select>

    <label for="toCurrency">To:</label>
    <select id="toCurrency">
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
      <option value="GBP">GBP</option>
      <option value="JPY">JPY</option>
      <option value="AUD">AUD</option>
      <option value="CAD">CAD</option>
    </select>

    <button onclick="runDashboard()">Update Dashboard</button>
  </div>

  <!-- Live TradingView Chart -->
  <div id="chart">
    <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_12345&symbol=FX:EURUSD&interval=5&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=light&style=1&timezone=exchange"
            width="100%" height="400" frameborder="0" allowtransparency="true"></iframe>
  </div>

  <!-- Dashboard Signals -->
  <h2>Dashboard Signals</h2>
  <ul id="signals"></ul>

  <!-- Consensus -->
  <h3 id="consensus">Consensus: ➡ Neutral</h3>

  <!-- News Feed -->
  <h2>Forex News Feed</h2>
  <ul id="newsFeed"></ul>

  <script src="script.js"></script>
</body>
</html>
